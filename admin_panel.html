<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRO-Host2 | لوحة المسؤول الأسطورية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --accent: #ff00d2;
            --bg-dark: #050505;
            --card-bg: rgba(20, 20, 20, 0.8);
            --text: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(0, 210, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* خلفية متحركة أسطورية */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #101010 0%, #050505 100%);
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* التصميم الرئيسي */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(to left, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .admin-badge {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            color: black;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-right: 15px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .user-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn {
            padding: 10px 25px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.5);
        }

        .btn-danger {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
        }

        .btn-danger:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.4);
        }

        /* لوحة التحكم */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .card:hover {
            border-color: var(--primary);
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--primary);
        }

        /* نموذج إنشاء المستخدم */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            opacity: 0.8;
        }

        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        /* قائمة المستخدمين */
        .user-list {
            list-style: none;
            max-height: 500px;
            overflow-y: auto;
        }

        .user-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
            transition: all 0.3s;
        }

        .user-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--border);
            transform: translateX(-5px);
        }

        .user-info h4 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .user-info span {
            font-size: 12px;
            opacity: 0.5;
        }

        .user-actions {
            display: flex;
            gap: 8px;
        }

        .user-actions .btn {
            padding: 6px 12px;
            font-size: 12px;
            background: rgba(255, 65, 108, 0.2);
            color: #ff416c;
            border: 1px solid #ff416c;
        }

        .user-actions .btn:hover {
            background: #ff416c;
            color: white;
        }

        /* زر المطور */
        .dev-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: rgba(0, 136, 204, 0.2);
            border: 1px solid #0088cc;
            color: #0088cc;
            padding: 12px 20px;
            border-radius: 50px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: all 0.3s;
        }

        .dev-btn:hover {
            background: #0088cc;
            color: white;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.5);
        }

        /* تنبيهات */
        #toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            border-radius: 15px;
            background: var(--card-bg);
            border: 1px solid var(--primary);
            color: white;
            z-index: 1000;
            display: none;
            animation: slideDown 0.5s forwards;
        }

        @keyframes slideDown {
            from { top: -100px; opacity: 0; }
            to { top: 30px; opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="animated-bg" id="bg">
        <div class="stars" id="stars"></div>
    </div>

    <div id="toast"></div>

    <div class="container">
        <header>
            <div class="logo-area">
                <img src="/avatar.png" style="width:40px;height:40px;border-radius:50%;border:2px solid var(--primary);margin-left:10px;" onerror="this.style.display='none'">
                <span class="logo">BRO HOST</span>
                <span class="admin-badge">ADMIN PANEL</span>
            </div>
            <div class="user-controls">
                <span id="adminName">مرحباً، <span style="color: var(--primary);">OMAR_ADMIN</span></span>
                <button onclick="logout()" class="btn btn-danger">
                    <i class="fas fa-sign-out-alt"></i> خروج
                </button>
            </div>
        </header>

        <div class="dashboard-grid">
            <!-- إنشاء مستخدم جديد -->
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-user-plus"></i> إنشاء حساب جديد
                </div>
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="newUsername" class="form-control" placeholder="مثال: omar_dev" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="newPassword" class="form-control" placeholder="6 أحرف على الأقل" autocomplete="new-password">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>مدة الاشتراك (أيام)</label>
                        <input type="number" id="newDuration" class="form-control" value="30" min="1">
                    </div>
                    <div class="form-group">
                        <label>عدد السيرفرات</label>
                        <input type="number" id="newMaxServers" class="form-control" value="3" min="1">
                    </div>
                </div>
                <button onclick="createUser()" class="btn btn-primary" style="width: 100%; justify-content: center;">
                    <i class="fas fa-magic"></i> إنشاء الحساب الأسطوري
                </button>
            </div>

            <!-- قائمة المستخدمين -->
            <div class="card">
                <div class="card-title">
                    <i class="fas fa-users"></i> إدارة المستخدمين
                    <button onclick="loadUsers()" style="background:none; border:none; color:var(--primary); cursor:pointer; margin-right:auto; font-size:18px;">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <ul class="user-list" id="userList">
                    <div style="text-align: center; opacity: 0.5; padding: 40px;">جاري تحميل البيانات...</div>
                </ul>
            </div>
        </div>
    </div>

    <a href="https://t.me/RLH55" target="_blank" class="dev-btn">
        <i class="fab fa-telegram-plane"></i> المطور @RLH55
    </a>

    <script>
        // إنشاء النجوم المتحركة
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                starsContainer.appendChild(star);
            }
        }
        createStars();

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.borderColor = type === 'success' ? 'var(--primary)' : '#ff416c';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        async function loadUsers() {
            try {
                const res = await fetch('/api/admin/users');
                if (res.ok) {
                    const users = await res.json();
                    const list = document.getElementById('userList');
                    list.innerHTML = '';
                    Object.keys(users).forEach(u => {
                        const item = document.createElement('li');
                        item.className = 'user-item';
                        const isAdmin = users[u].is_admin;
                        item.innerHTML = `
                            <div class="user-info">
                                <h4>${u} ${isAdmin ? '<i class="fas fa-crown" style="color:#ffd700"></i>' : ''}</h4>
                                <span>تاريخ الإنشاء: ${users[u].created_at ? users[u].created_at.split('T')[0] : 'غير معروف'}</span>
                            </div>
                            <div class="user-actions">
                                ${u !== 'OMAR_ADMIN' ? `<button onclick="deleteUser('${u}')" class="btn">🗑️ حذف</button>` : '<span style="opacity:0.5">المسؤول</span>'}
                            </div>
                        `;
                        list.appendChild(item);
                    });
                }
            } catch (e) {
                console.error(e);
                showToast('خطأ في تحميل المستخدمين', 'error');
            }
        }

        async function createUser() {
            const username = document.getElementById('newUsername').value;
            const password = document.getElementById('newPassword').value;
            const duration = document.getElementById('newDuration').value;
            const max_servers = document.getElementById('newMaxServers').value;

            if (!username || !password || !duration || !max_servers) {
                showToast('يرجى ملء جميع الحقول', 'error');
                return;
            }

            try {
                const res = await fetch('/api/admin/create_user', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password, duration, max_servers})
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('تم إنشاء الحساب بنجاح!');
                    document.getElementById('newUsername').value = '';
                    document.getElementById('newPassword').value = '';
                    loadUsers();
                } else {
                    showToast(data.error || 'حدث خطأ ما', 'error');
                }
            } catch (e) {
                showToast('خطأ في الاتصال بالسيرفر', 'error');
            }
        }

        async function deleteUser(username) {
            if (!confirm(`هل تريد حذف المستخدم "${username}"؟ سيتم حذف جميع بيانات هذا المستخدم!`)) {
                return;
            }

            try {
                const res = await fetch('/api/admin/delete_user', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username})
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('تم حذف المستخدم بنجاح!');
                    loadUsers();
                } else {
                    showToast(data.error || 'حدث خطأ ما', 'error');
                }
            } catch (e) {
                showToast('خطأ في الاتصال بالسيرفر', 'error');
            }
        }

        function logout() {
            fetch('/api/logout', {method: 'POST'}).then(() => {
                window.location.href = '/login';
            });
        }

        loadUsers();
    </script>
</body>
</html>
