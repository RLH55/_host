<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRO-Host | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --accent: #ff00d2;
            --bg-dark: #050816;
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
        }

        #canvas-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .grid-lines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image:
                linear-gradient(rgba(0, 210, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 210, 255, 0.025) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            z-index: 2;
            pointer-events: none;
        }

        .glow-1 { width: 400px; height: 400px; background: #00d2ff; top: -100px; left: -100px; }
        .glow-2 { width: 350px; height: 350px; background: #ff00d2; bottom: -50px; right: -50px; }
        .glow-3 { width: 300px; height: 300px; background: #3a7bd5; top: 50%; left: 50%; }

        .particles-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            animation: float-up 20s infinite ease-in;
        }

        @keyframes float-up {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
        }

        .login-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 95%;
            max-width: 500px;
            background: rgba(10, 14, 39, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 50px rgba(0, 210, 255, 0.2);
            z-index: 100;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.5);
        }

        .avatar-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 110px;
            height: 110px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 3s linear infinite;
            opacity: 0.3;
        }

        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        .logo-text {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(to left, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .tagline {
            font-size: 14px;
            opacity: 0.7;
            color: var(--primary);
        }

        .error-msg {
            background: rgba(255, 65, 108, 0.15);
            border: 1px solid rgba(255, 65, 108, 0.4);
            color: #ff416c;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            opacity: 0.8;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px 14px 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(0, 210, 255, 0.2);
            border-radius: 12px;
            color: var(--text);
            font-size: 15px;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 210, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--primary);
            opacity: 0.6;
            pointer-events: none;
        }

        .toggle-pass {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
            transition: all 0.3s;
        }

        .toggle-pass:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .remember-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.8;
        }

        .remember-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            font-weight: 900;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 14px;
            font-family: 'Cairo', sans-serif;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
            box-shadow: 0 10px 35px rgba(0, 210, 255, 0.35);
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 18px 45px rgba(0, 210, 255, 0.55);
        }

        .btn-login:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .btn-login:disabled {
            opacity: 0.8;
            cursor: not-allowed;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: 0.6s;
        }

        .btn-login:hover:not(:disabled)::before { left: 100%; }

        .dev-btn {
            width: 100%;
            padding: 13px;
            border-radius: 14px;
            border: 1.5px solid rgba(0, 183, 255, 0.35);
            background: linear-gradient(135deg, rgba(0, 183, 255, 0.06), rgba(41, 98, 255, 0.06));
            color: var(--text);
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .dev-btn .tg-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #2aabee, #229ed9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            transition: transform 0.3s;
            box-shadow: 0 0 10px rgba(42, 171, 238, 0.4);
        }

        .dev-btn:hover {
            border-color: #2aabee;
            background: linear-gradient(135deg, rgba(42, 171, 238, 0.12), rgba(34, 158, 217, 0.08));
            box-shadow: 0 0 25px rgba(42, 171, 238, 0.25);
            transform: translateY(-2px);
        }

        .dev-btn:hover .tg-icon {
            transform: rotate(15deg) scale(1.1);
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 210, 255, 0.2);
            font-size: 12px;
            opacity: 0.6;
        }

        .copyright {
            margin-bottom: 5px;
        }

        .version {
            font-size: 11px;
            opacity: 0.5;
        }

        @media (max-width: 600px) {
            .login-container { padding: 35px 22px; width: 90%; }
            .logo-text { font-size: 28px; }
            .avatar-img { width: 75px; height: 75px; }
        }
    </style>
</head>
<body>
    <canvas id="canvas-bg"></canvas>
    <div class="grid-lines"></div>
    <div class="glow-orb glow-1"></div>
    <div class="glow-orb glow-2"></div>
    <div class="glow-orb glow-3"></div>
    <div class="particles-container" id="particles"></div>

    <div class="login-container">
        <div class="logo-section">
            <div class="avatar-wrapper">
                <img src="avatar.png" alt="OMAR BRO" class="avatar-img" onerror="this.style.display='none'; document.querySelector('.fallback-icon').style.display='block';">
                <div class="fallback-icon" style="display:none; font-size:80px; line-height:1;">🚀</div>
                <div class="avatar-ring"></div>
            </div>
            <div class="logo-text">OMAR BRO HOST</div>
            <div class="tagline">لوحة تحكم احترافية للاستضافة</div>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>اسم المستخدم</label>
                <div class="input-wrapper">
                    <input type="text" id="username" class="form-control" placeholder="أدخل اسم المستخدم" required autocomplete="off">
                    <i class="fas fa-user input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-control" placeholder="أدخل كلمة المرور" required autocomplete="new-password">
                    <i class="fas fa-lock input-icon"></i>
                    <button type="button" class="toggle-pass" onclick="togglePassword()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <label class="remember-group">
                <input type="checkbox" id="remember">
                <span>تذكرني لمدة 30 يوماً</span>
            </label>

            <button type="submit" class="btn-login" id="loginBtn">
                🚀 دخول إلى النظام
            </button>

            <a href="https://t.me/RLH55" target="_blank" class="dev-btn">
                <span class="tg-icon"><i class="fab fa-telegram-plane"></i></span>
                <span>التواصل مع المطور <strong>@RLH55</strong></span>
            </a>
        </form>

        <div class="footer">
            <div class="copyright">©2025-2026 جميع الحقوق محفوظة المطور OMAR</div>
            <div class="version">BRO HOST · آمن ومشفر 🔒</div>
        </div>
    </div>

    <script>
        // Canvas Background
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const stars = [];
        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                r: Math.random() * 1.5 + 0.3,
                alpha: Math.random(),
                speed: Math.random() * 0.008 + 0.002,
                twinkleSpeed: Math.random() * 0.02 + 0.005
            });
        }

        const nodes = [];
        for (let i = 0; i < 40; i++) {
            nodes.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5
            });
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, '#050816');
            grad.addColorStop(0.5, '#0a0e27');
            grad.addColorStop(1, '#050816');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(s => {
                s.alpha += s.twinkleSpeed;
                if (s.alpha > 1 || s.alpha < 0) s.twinkleSpeed *= -1;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
                ctx.fill();
            });

            nodes.forEach(n => {
                n.x += n.vx;
                n.y += n.vy;
                if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
                if (n.y < 0 || n.y > canvas.height) n.vy *= -1;
            });

            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 150) {
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.strokeStyle = `rgba(0, 210, 255, ${0.12 * (1 - dist / 150)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }

            nodes.forEach(n => {
                ctx.beginPath();
                ctx.arc(n.x, n.y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 210, 255, 0.4)';
                ctx.fill();
            });

            requestAnimationFrame(drawCanvas);
        }
        drawCanvas();

        // Particles
        function createParticles() {
            const container = document.getElementById('particles');
            const colors = ['#00d2ff', '#3a7bd5', '#ff00d2', '#00ff88', '#ffffff'];

            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 4 + 1;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const duration = Math.random() * 15 + 10;
                const delay = Math.random() * 15;
                const left = Math.random() * 100;

                p.style.cssText = `
                    width: ${size}px;
                    height: ${size}px;
                    background: ${color};
                    left: ${left}%;
                    bottom: -10px;
                    animation-duration: ${duration}s;
                    animation-delay: ${delay}s;
                    box-shadow: 0 0 ${size * 3}px ${color};
                    opacity: 0;
                `;
                container.appendChild(p);
            }
        }
        createParticles();

        // Login Functions
        function togglePassword() {
            const pass = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (pass.type === 'password') {
                pass.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                pass.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        function showError(msg) {
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            if (btn) {
                btn.classList.remove('loading');
                btn.disabled = false;
                btn.textContent = '🚀 دخول إلى النظام';
            }
            if (errorMsg) {
                errorMsg.textContent = msg;
                errorMsg.style.display = 'block';
                setTimeout(() => { errorMsg.style.display = 'none'; }, 4000);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            if (!username || !password) {
                showError('❌ يرجى إدخال اسم المستخدم وكلمة المرور');
                return;
            }

            if (errorMsg) errorMsg.style.display = 'none';
            if (btn) {
                btn.disabled = true;
                btn.classList.add('loading');
                btn.textContent = '⏳ جاري التحقق...';
            }

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password, remember_me: remember})
                });

                const data = await res.json();

                if (res.ok && data.status === 'success') {
                    if (btn) {
                        btn.style.background = 'linear-gradient(135deg, #00ff88, #00d2ff)';
                        btn.textContent = '✅ جاري الدخول...';
                    }
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 800);
                } else {
                    showError(data.message || '❌ بيانات الدخول غير صحيحة!');
                }
            } catch (e) {
                showError('❌ خطأ في الاتصال بالسيرفر: ' + e.message);
            }
        }

        // Attach form submission
        const form = document.getElementById('loginForm');
        if (form) {
            form.addEventListener('submit', handleLogin);
        }

        // Enter key support
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const form = document.getElementById('loginForm');
                if (form) form.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
