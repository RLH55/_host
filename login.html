<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRO-Host | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --accent: #ff00d2;
            --bg-dark: #0a0e27;
            --card-bg: rgba(15, 20, 40, 0.9);
            --text: #ffffff;
            --border: rgba(0, 210, 255, 0.3);
            --border-light: rgba(0, 210, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* خلفية متحركة أسطورية */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1428 100%);
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            animation: twinkle var(--duration) infinite ease-in-out;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
        }

        .glow-1 {
            width: 400px;
            height: 400px;
            background: rgba(0, 210, 255, 0.3);
            top: -100px;
            right: -100px;
            animation: moveGlow1 20s infinite ease-in-out;
        }

        .glow-2 {
            width: 300px;
            height: 300px;
            background: rgba(58, 123, 213, 0.2);
            bottom: -100px;
            left: -100px;
            animation: moveGlow2 25s infinite ease-in-out;
        }

        @keyframes moveGlow1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-50px, 50px); }
        }

        @keyframes moveGlow2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, -50px); }
        }

        /* البطاقة الرئيسية */
        .login-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 35px;
            padding: 60px 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 210, 255, 0.2);
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 10;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* الأيقونة والعنوان */
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .rocket-icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .logo-text {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(to left, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .tagline {
            font-size: 16px;
            opacity: 0.6;
            color: var(--text);
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* حقول الإدخال */
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: 600;
            opacity: 0.8;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-control {
            width: 100%;
            padding: 16px 18px 16px 50px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid var(--border-light);
            border-radius: 15px;
            color: var(--text);
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Cairo', sans-serif;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 210, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3), inset 0 0 10px rgba(0, 210, 255, 0.1);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .input-icon {
            position: absolute;
            left: 18px;
            color: var(--primary);
            font-size: 18px;
            pointer-events: none;
        }

        /* خيار التذكر */
        .remember-group {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            gap: 10px;
        }

        .checkbox-custom {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            background: transparent;
        }

        .remember-group input[type="checkbox"] {
            display: none;
        }

        .remember-group input[type="checkbox"]:checked + .checkbox-custom {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        .remember-group input[type="checkbox"]:checked + .checkbox-custom::after {
            content: '✓';
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .remember-label {
            font-size: 14px;
            opacity: 0.7;
            cursor: pointer;
            user-select: none;
        }

        /* زر الدخول */
        .btn-login {
            width: 100%;
            padding: 16px;
            border-radius: 15px;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            font-weight: 900;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 15px;
            font-family: 'Cairo', sans-serif;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 210, 255, 0.5);
        }

        .btn-login:active {
            transform: translateY(-1px);
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: 0.6s;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        /* زر المطور */
        .dev-btn {
            width: 100%;
            padding: 14px;
            border-radius: 15px;
            border: 1.5px solid var(--border);
            background: transparent;
            color: var(--text);
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        .dev-btn:hover {
            border-color: var(--primary);
            background: rgba(0, 210, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
        }

        /* الحقوق */
        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid var(--border-light);
        }

        .copyright {
            font-size: 13px;
            opacity: 0.5;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .version {
            font-size: 12px;
            opacity: 0.4;
            color: var(--primary);
        }

        @media (max-width: 600px) {
            .login-container {
                padding: 40px 25px;
            }

            .logo-text {
                font-size: 32px;
            }

            .rocket-icon {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="animated-bg" id="bg">
        <div class="glow-orb glow-1"></div>
        <div class="glow-orb glow-2"></div>
        <div class="stars" id="stars"></div>
    </div>

    <div class="login-container">
        <!-- الشعار والأيقونة -->
        <div class="logo-section">
            <div class="rocket-icon">🚀</div>
            <div class="logo-text">BRO HOST</div>
            <div class="tagline">لوحة تحكم احترافية للاستضافة</div>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form onsubmit="login(event)">
            <!-- حقل اسم المستخدم -->
            <div class="form-group">
                <label>اسم المستخدم</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="username" class="form-control" placeholder="أدخل اسم المستخدم" required>
                </div>
            </div>

            <!-- حقل كلمة المرور -->
            <div class="form-group">
                <label>كلمة المرور</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" class="form-control" placeholder="أدخل كلمة المرور" required>
                </div>
            </div>

            <!-- خيار التذكر -->
            <div class="remember-group">
                <input type="checkbox" id="remember">
                <div class="checkbox-custom"></div>
                <label for="remember" class="remember-label">تذكري لمدة 30 يوماً</label>
            </div>

            <!-- زر الدخول -->
            <button type="submit" class="btn-login">دخول إلى لوحة التحكم</button>

            <!-- زر المطور -->
            <a href="https://t.me/RLH55" target="_blank" class="dev-btn">
                <i class="fab fa-telegram-plane"></i> المطور @RLH55
            </a>
        </form>

        <!-- الحقوق -->
        <div class="footer">
            <div class="copyright">© 2026 حقوق OMAR محفوظة</div>
            <div class="version">BRO HOST v2.0 · اتصال آمن ومشفر 🔒</div>
        </div>
    </div>

    <script>
        // إنشاء النجوم المتحركة
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                container.appendChild(star);
            }
        }

        // تسجيل الدخول
        async function login(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password, remember_me: remember})
                });

                if (res.ok) {
                    const data = await res.json();
                    if (data.status === 'success') {
                        // تأثير النجاح
                        document.querySelector('.login-container').style.animation = 'slideUp 0.5s reverse';
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 500);
                    }
                } else {
                    alert('❌ خطأ في بيانات الدخول!');
                }
            } catch (e) {
                alert('❌ خطأ في الاتصال بالسيرفر');
            }
        }

        // دعم مفتاح Enter
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const form = document.querySelector('form');
                form.dispatchEvent(new Event('submit'));
            }
        });

        // تهيئة الصفحة
        createStars();
    </script>
</body>
</html>
