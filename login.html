<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRO-Host2 | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg-dark: #050505;
            --card-bg: rgba(20, 20, 20, 0.8);
            --text: #ffffff;
            --border: rgba(0, 210, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--bg-dark); color: var(--text);
            height: 100vh; display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* خلفية متحركة */
        .animated-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at center, #101010 0%, #050505 100%);
        }

        .stars { position: absolute; width: 100%; height: 100%; }
        .star {
            position: absolute; background: white; border-radius: 50%; opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .login-card {
            background: var(--card-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 30px;
            padding: 50px; width: 90%; max-width: 450px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center; animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }

        .logo {
            font-size: 36px; font-weight: 900; margin-bottom: 10px;
            background: linear-gradient(to left, var(--primary), #ff00d2);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .input-group { margin-bottom: 25px; text-align: right; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; opacity: 0.7; }
        .input-group input {
            width: 100%; padding: 15px 20px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border); border-radius: 15px; color: white;
            font-size: 16px; transition: 0.3s;
        }
        .input-group input:focus { outline: none; border-color: var(--primary); background: rgba(255,255,255,0.1); }

        .btn-login {
            width: 100%; padding: 15px; border-radius: 15px; border: none;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white; font-weight: 900; font-size: 18px; cursor: pointer;
            transition: 0.3s; margin-top: 10px;
        }
        .btn-login:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 210, 255, 0.4); }

        .dev-info { margin-top: 30px; font-size: 14px; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="animated-bg" id="bg">
        <div class="stars" id="stars"></div>
    </div>

    <div class="login-card">
        <h1 class="logo">BRO-Host2</h1>
        <p style="margin-bottom: 40px; opacity: 0.6;">لوحة التحكم الأسطورية للاستضافة</p>

        <div class="input-group">
            <label>اسم المستخدم</label>
            <input type="text" id="username" placeholder="أدخل اسمك">
        </div>

        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button onclick="login()" class="btn-login">دخول إلى النظام 🚀</button>

        <div class="dev-info">
            بواسطة المطور <a href="https://t.me/RLH55" style="color:var(--primary); text-decoration:none;">@RLH55</a>
        </div>
    </div>

    <script>
        function createStars() {
            const container = document.getElementById('stars');
            for(let i=0; i<80; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                s.style.width = s.style.height = Math.random()*3+'px';
                s.style.top = Math.random()*100+'%';
                s.style.left = Math.random()*100+'%';
                s.style.setProperty('--duration', Math.random()*3+2+'s');
                container.appendChild(s);
            }
        }
        createStars();

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });

            if(res.ok) {
                window.location.href = '/';
            } else {
                alert('خطأ في بيانات الدخول!');
            }
        }
    </script>
</body>
</html>
