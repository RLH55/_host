<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRO-Host | لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --accent: #ff00d2;
            --bg-dark: #050816;
            --card-bg: rgba(10, 14, 39, 0.95);
            --text: #ffffff;
            --border: rgba(0, 210, 255, 0.4);
            --border-light: rgba(0, 210, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        html, body {
            width: 100%;
            min-height: 100%;
            background-color: var(--bg-dark);
            color: var(--text);
            overflow-x: hidden;
        }

        body { display: flex; flex-direction: column; }

        #canvas-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .grid-lines {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background-image:
                linear-gradient(rgba(0, 210, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 210, 255, 0.025) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 25px 20px;
            flex: 1;
            position: relative;
            z-index: 10;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), #fff, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            padding: 11px 22px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0, 210, 255, 0.5);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            box-shadow: 0 5px 15px rgba(255, 65, 108, 0.3);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.4);
        }

        /* شبكة السيرفرات */
        .servers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 22px;
            margin-bottom: 30px;
        }

        .server-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 210, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .server-card:hover {
            border-color: var(--primary);
            transform: translateY(-6px);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7), 0 0 50px rgba(0, 210, 255, 0.15);
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 18px;
        }

        .server-title {
            font-size: 20px;
            font-weight: 700;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-running {
            background: rgba(0, 255, 136, 0.15);
            color: #00ff88;
            border: 1px solid #00ff88;
        }

        .status-offline {
            background: rgba(255, 65, 108, 0.15);
            color: #ff416c;
            border: 1px solid #ff416c;
        }

        .server-info {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 18px;
            font-size: 13px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            opacity: 0.8;
        }

        .info-label { color: var(--primary); }

        .server-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .action-btn {
            padding: 11px;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-size: 13px;
            font-family: 'Cairo', sans-serif;
        }

        .action-btn:hover {
            background: rgba(0, 210, 255, 0.12);
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .action-btn.danger { color: #ff416c; border-color: rgba(255, 65, 108, 0.4); }
        .action-btn.danger:hover { background: rgba(255, 65, 108, 0.12); border-color: #ff416c; }
        .action-btn.success { color: #00ff88; border-color: rgba(0, 255, 136, 0.4); }
        .action-btn.success:hover { background: rgba(0, 255, 136, 0.12); border-color: #00ff88; }
        .action-btn.info { color: #00d2ff; border-color: rgba(0, 210, 255, 0.4); }
        .action-btn.info:hover { background: rgba(0, 210, 255, 0.12); }
        .action-btn.proxy { color: #b06aff; border-color: rgba(176, 106, 255, 0.4); grid-column: 1 / -1; }
        .action-btn.proxy:hover { background: rgba(176, 106, 255, 0.12); border-color: #b06aff; }

        /* Modals */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 35px;
            width: 90%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 210, 255, 0.15);
            animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .modal-close:hover { background: rgba(255, 65, 108, 0.3); }

        .modal-title {
            font-size: 22px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 25px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
        }

        .form-control {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid var(--border-light);
            border-radius: 12px;
            color: var(--text);
            font-size: 15px;
            transition: all 0.3s;
            font-family: 'Cairo', sans-serif;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0, 210, 255, 0.07);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
        }

        select.form-control option {
            background: #0a0e27;
            color: white;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-buttons .btn { flex: 1; justify-content: center; }

        .files-list { max-height: 250px; overflow-y: auto; }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-light);
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            transition: all 0.2s;
        }

        .file-item:hover { background: rgba(0, 210, 255, 0.07); border-color: var(--border); }

        .file-name {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-name.startup-file { color: #00ff88; font-weight: bold; }

        .file-size { font-size: 12px; opacity: 0.6; flex-shrink: 0; }

        .file-actions { display: flex; gap: 6px; }

        .file-btn {
            padding: 4px 10px;
            border-radius: 7px;
            border: 1px solid;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Cairo', sans-serif;
            transition: all 0.2s;
        }

        .file-btn.set-startup {
            color: #00ff88;
            border-color: rgba(0, 255, 136, 0.4);
        }

        .file-btn.set-startup:hover { background: rgba(0, 255, 136, 0.15); }

        .file-btn.delete-file {
            color: #ff416c;
            border-color: rgba(255, 65, 108, 0.4);
        }

        .file-btn.delete-file:hover { background: rgba(255, 65, 108, 0.15); }

        .startup-info {
            background: rgba(0, 255, 136, 0.08);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            color: #00ff88;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.5;
        }

        .empty-state-icon { font-size: 60px; margin-bottom: 15px; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 15px 25px;
            font-size: 15px;
            font-weight: bold;
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            white-space: nowrap;
        }

        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: #00ff88; color: #00ff88; }
        .toast.error { border-color: #ff416c; color: #ff416c; }

        /* رابط المطور */
        .dev-link {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text);
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .dev-link:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            .servers-grid { grid-template-columns: 1fr; }
            header { flex-direction: column; gap: 15px; }
            .header-controls { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <canvas id="canvas-bg"></canvas>
    <div class="grid-lines"></div>

    <div class="container">
        <header>
            <div class="logo-section">
                <img src="/avatar.png" alt="BRO" class="logo-avatar" onerror="this.style.display='none'">
                <div class="logo">BRO HOST</div>
            </div>
            <div class="header-controls">
                <button onclick="showCreateModal()" class="btn btn-primary">
                    <i class="fas fa-plus"></i> إنشاء سيرفر
                </button>
                <button onclick="logout()" class="btn btn-danger">
                    <i class="fas fa-sign-out-alt"></i> خروج
                </button>
            </div>
        </header>

        <div class="servers-grid" id="serversList">
            <div class="empty-state" style="grid-column:1/-1;">
                <div class="empty-state-icon">⏳</div>
                <p>جاري تحميل السيرفرات...</p>
            </div>
        </div>
    </div>

    <!-- نافذة إنشاء سيرفر -->
    <div class="modal" id="createModal">
        <div class="modal-content">
            <button class="modal-close" onclick="hideModal('createModal')">×</button>
            <div class="modal-title">إنشاء سيرفر جديد</div>
            <div class="form-group">
                <label>اسم السيرفر</label>
                <input type="text" id="serverName" class="form-control" placeholder="مثال: my-bot" onkeypress="if(event.key==='Enter') createServer()">
            </div>
            <div class="modal-buttons">
                <button onclick="createServer()" class="btn btn-primary">
                    <i class="fas fa-plus"></i> إنشاء
                </button>
                <button onclick="hideModal('createModal')" class="btn" style="background:#333;">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة معلومات السيرفر -->
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <button class="modal-close" onclick="hideModal('infoModal')">×</button>
            <div class="modal-title" id="infoTitle">معلومات السيرفر</div>
            <div id="infoContent"></div>
            <div class="modal-buttons">
                <button onclick="hideModal('infoModal')" class="btn btn-primary" style="justify-content:center;">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- نافذة رفع الملفات -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <button class="modal-close" onclick="hideModal('uploadModal')">×</button>
            <div class="modal-title" id="uploadTitle">رفع ملفات</div>
            <div class="form-group">
                <label>اختر الملفات</label>
                <input type="file" id="fileInput" class="form-control" multiple>
            </div>
            <div class="modal-buttons">
                <button onclick="uploadFiles()" class="btn btn-primary">
                    <i class="fas fa-upload"></i> رفع
                </button>
                <button onclick="hideModal('uploadModal')" class="btn" style="background:#333;">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة البروكسي -->
    <div class="modal" id="proxyModal">
        <div class="modal-content">
            <button class="modal-close" onclick="hideModal('proxyModal')">×</button>
            <div class="modal-title" id="proxyTitle">نظام البروكسي</div>
            <div id="proxyContent"></div>
            <div class="modal-buttons">
                <button onclick="hideModal('proxyModal')" class="btn btn-primary" style="justify-content:center;">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- رابط المطور -->
    <a href="https://t.me/RLH55" target="_blank" class="dev-link">
        <i class="fab fa-telegram-plane" style="color:#00d2ff;"></i> @RLH55
    </a>

    <script>
        let currentServer = null;

        // ===== خلفية Canvas =====
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const stars = [];
        for (let i = 0; i < 150; i++) {
            stars.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                r: Math.random() * 1.2 + 0.2,
                alpha: Math.random(),
                twinkleSpeed: Math.random() * 0.015 + 0.003
            });
        }

        const nodes = [];
        for (let i = 0; i < 30; i++) {
            nodes.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4
            });
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, '#050816');
            grad.addColorStop(0.5, '#0a0e27');
            grad.addColorStop(1, '#050816');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(s => {
                s.alpha += s.twinkleSpeed;
                if (s.alpha > 1 || s.alpha < 0) s.twinkleSpeed *= -1;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${Math.abs(s.alpha)})`;
                ctx.fill();
            });

            nodes.forEach(n => {
                n.x += n.vx; n.y += n.vy;
                if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
                if (n.y < 0 || n.y > canvas.height) n.vy *= -1;
            });

            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 160) {
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.strokeStyle = `rgba(0,210,255,${0.1*(1-dist/160)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }

            nodes.forEach(n => {
                ctx.beginPath();
                ctx.arc(n.x, n.y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,210,255,0.35)';
                ctx.fill();
            });

            requestAnimationFrame(drawCanvas);
        }
        drawCanvas();

        // ===== Toast =====
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${type} show`;
            setTimeout(() => { t.className = `toast ${type}`; }, 3000);
        }

        // ===== Modals =====
        function hideModal(id) { document.getElementById(id).style.display = 'none'; }

        function showCreateModal() {
            document.getElementById('serverName').value = '';
            document.getElementById('createModal').style.display = 'flex';
        }

        // ===== تحميل السيرفرات =====
        async function loadServers() {
            try {
                const res = await fetch('/api/servers/list');
                const servers = await res.json();
                const list = document.getElementById('serversList');
                list.innerHTML = '';

                if (servers.length === 0) {
                    list.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="empty-state-icon">📭</div><p>لا توجد سيرفرات بعد. اضغط "إنشاء سيرفر" للبدء!</p></div>';
                    return;
                }

                servers.forEach(s => {
                    const card = document.createElement('div');
                    card.className = 'server-card';
                    const isRunning = s.status === 'running';

                    card.innerHTML = `
                        <div class="server-header">
                            <div class="server-title">${s.name}</div>
                            <div class="status-badge ${isRunning ? 'status-running' : 'status-offline'}">
                                <i class="fas fa-circle" style="font-size:8px;"></i>
                                ${isRunning ? 'يعمل' : 'متوقف'}
                            </div>
                        </div>

                        <div class="server-info">
                            <div class="info-item">
                                <span class="info-label">الحالة:</span>
                                <span>${isRunning ? '🟢 يعمل الآن' : '🔴 متوقف'}</span>
                            </div>
                            ${s.startup_file ? `<div class="info-item"><span class="info-label">ملف التشغيل:</span><span style="color:#00ff88;">📄 ${s.startup_file}</span></div>` : '<div class="info-item"><span class="info-label">ملف التشغيل:</span><span style="color:#ff6b8a;">⚠️ غير محدد</span></div>'}
                        </div>

                        <div class="server-actions">
                            <button onclick="serverAction('${s.name}', '${isRunning ? 'stop' : 'start'}')"
                                    class="action-btn ${isRunning ? 'danger' : 'success'}">
                                ${isRunning ? '<i class="fas fa-stop"></i> إيقاف' : '<i class="fas fa-play"></i> تشغيل'}
                            </button>
                            <button onclick="deleteServer('${s.name}')" class="action-btn danger">
                                <i class="fas fa-trash"></i> حذف
                            </button>
                        </div>

                        <div class="server-actions">
                            <button onclick="showServerInfo('${s.name}')" class="action-btn info">
                                <i class="fas fa-folder-open"></i> الملفات
                            </button>
                            <button onclick="showUploadUI('${s.name}')" class="action-btn success">
                                <i class="fas fa-cloud-upload-alt"></i> رفع ملفات
                            </button>
                        </div>

                        <button onclick="showProxyUI('${s.name}')" class="action-btn proxy">
                            <i class="fas fa-network-wired"></i> البروكسي
                        </button>
                    `;
                    list.appendChild(card);
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function createServer() {
            const name = document.getElementById('serverName').value.trim();
            if (!name) { showToast('أدخل اسم السيرفر', 'error'); return; }

            const res = await fetch('/api/servers/create', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name})
            });

            if (res.ok) {
                hideModal('createModal');
                showToast('✅ تم إنشاء السيرفر بنجاح!');
                loadServers();
            } else {
                const err = await res.json();
                showToast('❌ ' + (err.error || 'فشل إنشاء السيرفر'), 'error');
            }
        }

        async function deleteServer(name) {
            if (!confirm(`هل تريد حذف السيرفر "${name}"؟`)) return;
            const res = await fetch('/api/servers/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name})
            });
            if (res.ok) {
                showToast('🗑️ تم حذف السيرفر');
                loadServers();
            }
        }

        async function serverAction(name, action) {
            const res = await fetch('/api/servers/action', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, action})
            });

            const data = await res.json();

            if (res.ok) {
                showToast(action === 'start' ? '🚀 تم تشغيل السيرفر!' : '⏹️ تم إيقاف السيرفر');
            } else {
                showToast('❌ ' + (data.error || 'فشل العملية'), 'error');
            }
            setTimeout(loadServers, 600);
        }

        async function showServerInfo(name) {
            currentServer = name;
            const res = await fetch(`/api/servers/info/${name}`);
            const info = await res.json();

            let content = '';

            // معلومات ملف التشغيل
            if (info.startup_file) {
                content += `<div class="startup-info"><i class="fas fa-play-circle"></i> ملف التشغيل الحالي: <strong>${info.startup_file}</strong></div>`;
            } else {
                content += `<div style="background:rgba(255,107,138,0.1);border:1px solid rgba(255,107,138,0.3);border-radius:10px;padding:10px 14px;font-size:13px;color:#ff6b8a;margin-bottom:15px;">⚠️ لم يتم تحديد ملف التشغيل. اضغط "تعيين كملف تشغيل" على أحد الملفات أدناه.</div>`;
            }

            content += `
                <div class="server-info">
                    <div class="info-item"><span class="info-label">الحالة:</span><span>${info.status === 'running' ? '🟢 يعمل' : '🔴 متوقف'}</span></div>
                    <div class="info-item"><span class="info-label">عدد الملفات:</span><span>${info.file_count}</span></div>
                    <div class="info-item"><span class="info-label">الحجم الكلي:</span><span>${(info.total_size / 1024 / 1024).toFixed(2)} MB</span></div>
                </div>
                <h4 style="color:var(--primary);margin-bottom:12px;font-size:15px;">الملفات:</h4>
                <div class="files-list">
            `;

            if (info.files.length === 0) {
                content += '<div style="text-align:center;opacity:0.5;padding:25px;">لا توجد ملفات. ارفع ملفاتك أولاً.</div>';
            } else {
                info.files.forEach(f => {
                    const isStartup = f.name === info.startup_file;
                    const canRun = f.name.endsWith('.py') || f.name.endsWith('.js');
                    content += `
                        <div class="file-item">
                            <span class="file-name ${isStartup ? 'startup-file' : ''}">
                                <i class="fas fa-file${f.name.endsWith('.py') ? '-code' : f.name.endsWith('.js') ? '-code' : ''}"></i>
                                ${f.name} ${isStartup ? '⭐' : ''}
                            </span>
                            <div style="display:flex;align-items:center;gap:8px;">
                                <span class="file-size">${(f.size / 1024).toFixed(1)} KB</span>
                                <div class="file-actions">
                                    ${canRun && !isStartup ? `<button class="file-btn set-startup" onclick="setStartupFile('${name}', '${f.name}')">▶ تعيين تشغيل</button>` : ''}
                                    <button class="file-btn delete-file" onclick="deleteFile('${name}', '${f.name}')">🗑</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            content += '</div>';
            document.getElementById('infoContent').innerHTML = content;
            document.getElementById('infoTitle').textContent = `ملفات السيرفر: ${name}`;
            document.getElementById('infoModal').style.display = 'flex';
        }

        async function setStartupFile(serverName, filename) {
            const res = await fetch('/api/servers/set_startup', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: serverName, startup_file: filename})
            });

            if (res.ok) {
                showToast(`✅ تم تعيين "${filename}" كملف تشغيل!`);
                showServerInfo(serverName);
                loadServers();
            } else {
                const err = await res.json();
                showToast('❌ ' + (err.error || 'فشل'), 'error');
            }
        }

        async function deleteFile(serverName, filename) {
            if (!confirm(`حذف الملف "${filename}"؟`)) return;
            const res = await fetch(`/api/servers/delete_file/${serverName}/${filename}`, {
                method: 'POST'
            });
            if (res.ok) {
                showToast('🗑️ تم حذف الملف');
                showServerInfo(serverName);
            }
        }

        function showUploadUI(name) {
            currentServer = name;
            document.getElementById('uploadTitle').textContent = `رفع ملفات - ${name}`;
            document.getElementById('fileInput').value = '';
            document.getElementById('uploadModal').style.display = 'flex';
        }

        async function uploadFiles() {
            const files = document.getElementById('fileInput').files;
            if (files.length === 0) { showToast('اختر ملفات أولاً', 'error'); return; }

            let success = 0;
            for (let file of files) {
                const formData = new FormData();
                formData.append('file', file);
                const res = await fetch(`/api/servers/upload/${currentServer}`, {
                    method: 'POST',
                    body: formData
                });
                if (res.ok) success++;
            }

            hideModal('uploadModal');
            showToast(`✅ تم رفع ${success} ملف بنجاح!`);
            loadServers();
        }

        function showProxyUI(name) {
            currentServer = name;
            document.getElementById('proxyTitle').textContent = `البروكسي - ${name}`;
            const origin = window.location.origin;
            document.getElementById('proxyContent').innerHTML = `
                <div class="server-info">
                    <p style="margin-bottom:12px;opacity:0.8;">استخدم هذا الرابط للوصول إلى السيرفر عبر البروكسي:</p>
                    <div style="background:rgba(0,210,255,0.08);padding:14px;border-radius:10px;border:1px solid var(--border);word-break:break-all;font-family:monospace;font-size:13px;">
                        ${origin}/proxy/&lt;PORT&gt;/&lt;PATH&gt;
                    </div>
                    <p style="margin-top:12px;font-size:13px;opacity:0.6;">
                        <strong>مثال:</strong> <code>${origin}/proxy/8000/api/data</code>
                    </p>
                </div>
            `;
            document.getElementById('proxyModal').style.display = 'flex';
        }

        function logout() {
            fetch('/api/logout', {method: 'POST'}).then(() => {
                window.location.href = '/login';
            });
        }

        // تحميل أولي وتحديث دوري
        loadServers();
        setInterval(loadServers, 5000);
    </script>
</body>
</html>
