<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRO-Host2 | لوحة التحكم الأسطورية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --accent: #ff00d2;
            --bg-dark: #050505;
            --card-bg: rgba(20, 20, 20, 0.8);
            --text: #ffffff;
            --border: rgba(0, 210, 255, 0.3);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* خلفية متحركة */
        .animated-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at center, #101010 0%, #050505 100%);
        }

        .stars { position: absolute; width: 100%; height: 100%; }
        .star {
            position: absolute; background: white; border-radius: 50%; opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; margin-bottom: 30px; border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 28px; font-weight: 900;
            background: linear-gradient(to left, var(--primary), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .btn {
            padding: 10px 20px; border-radius: 12px; border: none; cursor: pointer;
            font-weight: bold; transition: 0.3s; display: flex; align-items: center; gap: 10px;
            color: white; text-decoration: none;
        }

        .btn-primary { background: linear-gradient(45deg, var(--primary), var(--secondary)); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4); }
        .btn-danger { background: #ff416c; }
        .btn-success { background: #00ff88; color: black; }
        .btn-info { background: #0088cc; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; }

        .server-card {
            background: var(--card-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 20px; padding: 25px;
            transition: 0.3s; position: relative; overflow: hidden;
        }

        .server-card:hover { border-color: var(--primary); transform: translateY(-5px); }

        .status-badge {
            position: absolute; top: 15px; left: 15px; padding: 5px 12px;
            border-radius: 20px; font-size: 12px; font-weight: bold;
        }

        .status-running { background: rgba(0, 255, 136, 0.2); color: #00ff88; }
        .status-offline { background: rgba(255, 65, 108, 0.2); color: #ff416c; }

        .server-title { font-size: 20px; font-weight: 700; margin: 30px 0 10px 0; }

        .server-actions {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;
        }

        .server-actions .btn { padding: 10px; font-size: 13px; justify-content: center; }

        .server-details {
            background: rgba(255,255,255,0.05); border-radius: 12px; padding: 15px;
            margin: 15px 0; font-size: 13px;
        }

        .detail-item { display: flex; justify-content: space-between; margin: 5px 0; }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000;
        }

        .modal-content {
            background: #151515; border: 1px solid var(--primary); border-radius: 25px;
            padding: 40px; width: 90%; max-width: 500px; position: relative;
        }

        .modal-close { position: absolute; top: 15px; right: 15px; cursor: pointer; font-size: 24px; }

        .dev-btn {
            position: fixed; bottom: 30px; left: 30px;
            background: rgba(0, 136, 204, 0.2); border: 1px solid #0088cc;
            color: #0088cc; padding: 12px 20px; border-radius: 50px;
            text-decoration: none; display: flex; align-items: center; gap: 10px;
            font-weight: bold; backdrop-filter: blur(10px); z-index: 100;
        }

        .file-list { max-height: 300px; overflow-y: auto; margin: 15px 0; }
        .file-item {
            background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;
            margin: 5px 0; display: flex; justify-content: space-between; align-items: center;
        }

        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            .server-actions { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="animated-bg" id="bg">
        <div class="stars" id="stars"></div>
    </div>

    <div class="container">
        <header>
            <span class="logo">BRO-Host2</span>
            <div style="display:flex; gap:15px;">
                <button onclick="showCreateModal()" class="btn btn-primary">
                    <i class="fas fa-plus"></i> إنشاء سيرفر
                </button>
                <button onclick="logout()" class="btn btn-danger">خروج</button>
            </div>
        </header>

        <div class="dashboard-grid" id="serverList">
            <div style="grid-column:1/-1; text-align:center; opacity:0.5; padding:50px;">جاري تحميل السيرفرات...</div>
        </div>
    </div>

    <!-- نافذة إنشاء سيرفر -->
    <div class="modal" id="createModal">
        <div class="modal-content">
            <span class="modal-close" onclick="hideCreateModal()">×</span>
            <h2 style="margin-bottom:20px; color:var(--primary)">إنشاء سيرفر جديد</h2>
            <input type="text" id="serverName" placeholder="اسم السيرفر" 
                   style="width:100%; padding:15px; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:12px; color:white; margin-bottom:20px;">
            <div style="display:flex; gap:10px;">
                <button onclick="createServer()" class="btn btn-primary" style="flex:1; justify-content:center;">إنشاء</button>
                <button onclick="hideCreateModal()" class="btn" style="background:#333; flex:1; justify-content:center;">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة معلومات السيرفر -->
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <span class="modal-close" onclick="hideInfoModal()">×</span>
            <h2 style="margin-bottom:20px; color:var(--primary)" id="infoTitle">معلومات السيرفر</h2>
            <div id="infoContent"></div>
            <button onclick="hideInfoModal()" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:20px;">إغلاق</button>
        </div>
    </div>

    <!-- نافذة رفع الملفات -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <span class="modal-close" onclick="hideUploadModal()">×</span>
            <h2 style="margin-bottom:20px; color:var(--primary)" id="uploadTitle">رفع ملفات</h2>
            <input type="file" id="fileInput" multiple style="width:100%; padding:10px; margin-bottom:15px;">
            <button onclick="uploadFiles()" class="btn btn-success" style="width:100%; justify-content:center;">رفع الملفات</button>
            <button onclick="hideUploadModal()" class="btn" style="background:#333; width:100%; justify-content:center; margin-top:10px;">إلغاء</button>
        </div>
    </div>

    <!-- نافذة البروكسي -->
    <div class="modal" id="proxyModal">
        <div class="modal-content">
            <span class="modal-close" onclick="hideProxyModal()">×</span>
            <h2 style="margin-bottom:20px; color:var(--primary)" id="proxyTitle">نظام البروكسي</h2>
            <div id="proxyContent"></div>
            <button onclick="hideProxyModal()" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:20px;">إغلاق</button>
        </div>
    </div>

    <a href="https://t.me/RLH55" target="_blank" class="dev-btn">
        <i class="fab fa-telegram-plane"></i> المطور @RLH55
    </a>

    <script>
        let currentServer = null;

        function createStars() {
            const container = document.getElementById('stars');
            for(let i=0; i<100; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                s.style.width = s.style.height = Math.random()*3+'px';
                s.style.top = Math.random()*100+'%';
                s.style.left = Math.random()*100+'%';
                s.style.setProperty('--duration', Math.random()*3+2+'s');
                container.appendChild(s);
            }
        }
        createStars();

        function showCreateModal() { document.getElementById('createModal').style.display = 'flex'; }
        function hideCreateModal() { document.getElementById('createModal').style.display = 'none'; }
        function showInfoModal() { document.getElementById('infoModal').style.display = 'flex'; }
        function hideInfoModal() { document.getElementById('infoModal').style.display = 'none'; }
        function showUploadModal() { document.getElementById('uploadModal').style.display = 'flex'; }
        function hideUploadModal() { document.getElementById('uploadModal').style.display = 'none'; }
        function showProxyModal() { document.getElementById('proxyModal').style.display = 'flex'; }
        function hideProxyModal() { document.getElementById('proxyModal').style.display = 'none'; }

        async function loadServers() {
            const res = await fetch('/api/servers/list');
            const servers = await res.json();
            const list = document.getElementById('serverList');
            list.innerHTML = '';
            
            if (servers.length === 0) {
                list.innerHTML = '<div style="grid-column:1/-1; text-align:center; opacity:0.5; padding:50px;">لا توجد سيرفرات بعد</div>';
                return;
            }
            
            servers.forEach(s => {
                const card = document.createElement('div');
                card.className = 'server-card';
                card.innerHTML = `
                    <div class="status-badge status-${s.status}">${s.status === 'running' ? '🟢 يعمل' : '🔴 متوقف'}</div>
                    <h3 class="server-title">${s.name}</h3>
                    
                    <div class="server-details">
                        <div class="detail-item">
                            <span>الحالة:</span>
                            <span style="color:${s.status === 'running' ? '#00ff88' : '#ff416c'}">${s.status === 'running' ? 'يعمل' : 'متوقف'}</span>
                        </div>
                    </div>
                    
                    <div class="server-actions">
                        <button onclick="serverAction('${s.name}', '${s.status === 'running' ? 'stop' : 'start'}')" 
                                class="btn" style="background:${s.status === 'running' ? '#ff416c' : '#00ff88'}; color:${s.status === 'running' ? 'white' : 'black'};">
                            ${s.status === 'running' ? '⏹️ إيقاف' : '▶️ تشغيل'}
                        </button>
                        <button onclick="deleteServer('${s.name}')" class="btn btn-danger">🗑️ حذف</button>
                    </div>
                    
                    <div class="server-actions">
                        <button onclick="showServerInfo('${s.name}')" class="btn btn-info">ℹ️ معلومات</button>
                        <button onclick="showUploadUI('${s.name}')" class="btn btn-success">📤 رفع</button>
                    </div>
                    
                    <div class="server-actions">
                        <button onclick="showProxyUI('${s.name}')" class="btn" style="background:#9c27b0; grid-column:1/-1;">🔀 البروكسي</button>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        async function createServer() {
            const name = document.getElementById('serverName').value;
            if (!name) { alert('أدخل اسم السيرفر'); return; }
            
            const res = await fetch('/api/servers/create', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name})
            });
            if(res.ok) { 
                hideCreateModal(); 
                document.getElementById('serverName').value = '';
                loadServers(); 
            } else {
                const err = await res.json();
                alert('خطأ: ' + err.error);
            }
        }

        async function deleteServer(name) {
            if (!confirm(`هل تريد حذف السيرفر "${name}"؟`)) return;
            
            const res = await fetch('/api/servers/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name})
            });
            if(res.ok) { loadServers(); }
        }

        async function serverAction(name, action) {
            await fetch('/api/servers/action', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name, action})
            });
            loadServers();
        }

        async function showServerInfo(name) {
            currentServer = name;
            const res = await fetch(`/api/servers/info/${name}`);
            const info = await res.json();
            
            let content = `<div class="server-details">
                <div class="detail-item"><span>الحالة:</span><span>${info.status}</span></div>
                <div class="detail-item"><span>عدد الملفات:</span><span>${info.file_count}</span></div>
                <div class="detail-item"><span>الحجم الكلي:</span><span>${(info.total_size / 1024 / 1024).toFixed(2)} MB</span></div>
            </div>
            <h4 style="margin-top:20px; color:var(--primary)">الملفات:</h4>
            <div class="file-list">`;
            
            info.files.forEach(f => {
                content += `<div class="file-item">
                    <span>${f.name}</span>
                    <span>${(f.size / 1024).toFixed(2)} KB</span>
                </div>`;
            });
            
            content += '</div>';
            document.getElementById('infoContent').innerHTML = content;
            document.getElementById('infoTitle').textContent = `معلومات السيرفر: ${name}`;
            showInfoModal();
        }

        function showUploadUI(name) {
            currentServer = name;
            document.getElementById('uploadTitle').textContent = `رفع ملفات - ${name}`;
            showUploadModal();
        }

        async function uploadFiles() {
            const files = document.getElementById('fileInput').files;
            if (files.length === 0) { alert('اختر ملفات'); return; }
            
            for (let file of files) {
                const formData = new FormData();
                formData.append('file', file);
                
                await fetch(`/api/servers/upload/${currentServer}`, {
                    method: 'POST',
                    body: formData
                });
            }
            
            alert('تم رفع الملفات بنجاح!');
            hideUploadModal();
            loadServers();
        }

        function showProxyUI(name) {
            currentServer = name;
            document.getElementById('proxyTitle').textContent = `البروكسي - ${name}`;
            
            let content = `<div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:12px;">
                <p style="margin-bottom:15px; opacity:0.8;">استخدم هذا الرابط للوصول إلى السيرفر عبر البروكسي:</p>
                <div style="background:rgba(0,210,255,0.1); padding:15px; border-radius:8px; border:1px solid var(--border); word-break:break-all;">
                    <code>/proxy/&lt;PORT&gt;/&lt;PATH&gt;</code>
                </div>
                <p style="margin-top:15px; font-size:13px; opacity:0.6;">مثال: <code>/proxy/8000/api/data</code></p>
            </div>`;
            
            document.getElementById('proxyContent').innerHTML = content;
            showProxyModal();
        }

        function logout() { 
            fetch('/api/logout', {method:'POST'}).then(()=>window.location.href='/login'); 
        }

        loadServers();
        setInterval(loadServers, 5000);
    </script>
</body>
</html>
